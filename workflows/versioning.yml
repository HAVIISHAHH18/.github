name: Semantic Versioning

on:
  push:
    branches:
      - dev
  pull_request:
    types: [closed]
    branches:
      - main

jobs:
  versioning:
    runs-on: <add-your-runner>
    if: github.event_name == 'push' || (github.event.pull_request.merged == true && github.event.pull_request.base.ref == 'main')
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0  # full history needed for tags

      - name: Set up Git
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "github-actions@github.com"

      - name: Determine version bump
        id: version
        run: |
          
          commit_msg=$(git log -1 --pretty=%B)
          echo "Commit message: $commit_msg"

          if [[ "${GITHUB_REF##*/}" == "dev" ]]; then
          
            last_tag=$(git tag --sort=-creatordate | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+-beta$' | head -n 1)
            default_tag="v0.0.0-beta"
          else
          
            last_tag=$(git tag --sort=-creatordate | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -n 1)
            default_tag="v0.0.0"
          fi

          last_tag=${last_tag:-$default_tag}
          echo "Using base tag: $last_tag"

          version=${last_tag#v}
          version=${version%-beta}

          IFS='.' read -r major minor patch <<< "$version"

          if [[ "$commit_msg" == *"#major"* ]]; then
            major=$((major + 1))
            minor=0
            patch=0
            bump="major"
          elif [[ "$commit_msg" == *"#minor"* ]]; then
            minor=$((minor + 1))
            patch=0
            bump="minor"
          else
            patch=$((patch + 1))
            bump="patch"
          fi

          if [[ "${GITHUB_REF##*/}" == "dev" ]]; then
            new_tag="v$major.$minor.$patch-beta"
          else
            new_tag="v$major.$minor.$patch"
          fi

          echo "New version: $new_tag"
          echo "new_tag=$new_tag" >> $GITHUB_OUTPUT
          echo "bump_type=$bump" >> $GITHUB_OUTPUT

      - name: Create Tag
        run: |
          git tag ${{ steps.version.outputs.new_tag }}
          git push origin ${{ steps.version.outputs.new_tag }}
